<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系3D模拟</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="info">
        <h1>太阳系模拟</h1>
        <div id="controls">
            <button id="pause-btn">暂停/继续</button>
            <button id="reset-btn">重置</button>
            <div class="slider-container">
                <label for="speed-slider">公转速度: </label>
                <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1">
                <span id="speed-value">1x</span>
            </div>
            <div class="view-buttons">
                <button id="top-view">俯视图</button>
                <button id="side-view">侧视图</button>
            </div>
        </div>
        <p id="texture-notice" style="color: #ffcc00; font-size: 14px; margin-top: 10px;">注意：为了获得最佳效果，请将行星纹理图片放入textures文件夹中</p>
        <a href="../index.html" class="home-link" style="display: block; margin-top: 15px; color: #4285f4; text-decoration: none;">返回主页</a>
    </div>
    <div id="planet-info"></div>
    <div id="canvas-container"></div>

    <!-- 引入Three.js库 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <!-- 引入轨道控制器 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <!-- 引入效果脚本 -->
    <script src="js/effects.js"></script>
    <!-- 引入主脚本 -->
    <script src="js/main.js"></script>
</body>
</html>
