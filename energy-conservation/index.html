<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能量守恒定律 3D 演示</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div id="info">
            <h1>能量守恒定律</h1>
            <div class="legend">
                <div class="legend-item"><span class="color potential"></span> 势能</div>
                <div class="legend-item"><span class="color kinetic"></span> 动能</div>
                <div class="legend-item"><span class="color total"></span> 总能量</div>
            </div>
            <div id="energy-values">
                <div>势能: <span id="potential-value">0</span> J</div>
                <div>动能: <span id="kinetic-value">0</span> J</div>
                <div>总能量: <span id="total-value">0</span> J</div>
            </div>
            <div class="controls">
                <button id="reset-btn">重置</button>
                <button id="pause-btn">暂停/继续</button>
                <div class="slider-container">
                    <label for="gravity">重力加速度: <span id="gravity-value">9.8</span> m/s²</label>
                    <input type="range" id="gravity" min="1" max="20" step="0.1" value="9.8">
                </div>
                <div class="slider-container">
                    <label for="friction">摩擦系数: <span id="friction-value">0.1</span></label>
                    <input type="range" id="friction" min="0" max="0.5" step="0.01" value="0.1">
                </div>
                <div style="margin-top: 15px;">
                    <a href="../index.html" style="color: #4285f4; text-decoration: none;">返回主页</a>
                </div>
            </div>
        </div>
        <div id="canvas-container"></div>
    </div>

    <!-- Three.js库 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/geometries/TextGeometry.js"></script>
    
    <!-- 自定义脚本 -->
    <script src="js/energyConservation.js"></script>
</body>
</html>
